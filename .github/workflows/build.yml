# 一次推送，同时产出 Windows 与 macOS 的安装包。
#
# 用途：**你没有 Mac，但需要 .dmg**。GitHub 提供免费的 macOS 构建机
#      （公开仓库完全免费），在上面跑一次就能拿到原生 .app / .dmg。
#
# 怎么用：
#   1. 把这个项目推到 GitHub（私有仓库也行，私有仓库每月有免费额度）
#   2. 进仓库的 Actions 页 → 选 "打包" → Run workflow
#   3. 跑完在该次运行的 Artifacts 里下载：
#        牙槽骨吸收测量-Windows  →  单文件 exe + 安装包
#        牙槽骨吸收测量-macOS    →  .dmg
#
# 打 tag（如 v1.0.0）推送时，还会自动建一个 Release 把这些文件挂上去，
# 直接把 Release 链接发给同事即可。

name: 打包

on:
  workflow_dispatch:          # 手动触发
    inputs:
      version:
        description: 版本号
        default: "1.0.0"
  push:
    tags: ["v*"]              # 推 v1.0.0 这样的 tag 时自动打包并发 Release

permissions:
  contents: write             # 建 Release 需要

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: 跑测试
        run: |
          python tests/test_core.py
          python tests/test_smoke.py

      - name: 打单文件版
        env:
          BUILD_MODE: onefile
        run: pyinstaller build.spec --noconfirm --clean

      - name: 打文件夹版（安装包用）
        env:
          BUILD_MODE: onedir
        run: pyinstaller build.spec --noconfirm

      - name: 生成安装包
        env:
          APP_VERSION: ${{ github.event.inputs.version || '1.0.0' }}
        run: |
          choco install innosetup --no-progress -y
          & "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe" installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: 牙槽骨吸收测量-Windows
          path: |
            dist/*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest     # Apple Silicon 运行器，产出 arm64 版
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 构建 .app 与 .dmg
        env:
          APP_VERSION: ${{ github.event.inputs.version || '1.0.0' }}
        run: bash build_macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: 牙槽骨吸收测量-macOS
          path: dist/*.dmg
          if-no-files-found: error

  release:
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          body: |
            ## 下载

            - **Windows**：`牙槽骨吸收测量_安装包_*.exe`（推荐，启动快）
              或 `牙槽骨吸收测量.exe`（单文件，免安装，可直接发微信）
            - **macOS**：`牙槽骨吸收测量_*.dmg`

            两个平台都**不需要预装 Python 或任何依赖**。

            > macOS 首次打开若提示「无法验证开发者」：
            > 右键点图标 → 打开 → 再点「打开」，只需这一次。
